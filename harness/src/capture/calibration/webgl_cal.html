<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MoL-Bench WebGL Calibration Scene (BCR)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('c');
      const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
      if (!gl) {
        throw new Error('WebGL2 not available in webgl_cal.html');
      }

      const vsSource = `#version 300 es
        in vec2 a_pos;
        out vec2 v_uv;
        void main() {
          v_uv = a_pos * 0.5 + 0.5;
          gl_Position = vec4(a_pos, 0.0, 1.0);
        }
      `;

      const fsSource = `#version 300 es
        precision highp float;
        in vec2 v_uv;
        uniform float u_time;
        uniform vec2 u_res;
        out vec4 outColor;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        void main() {
          vec2 uv = (gl_FragCoord.xy / u_res) * 4.0;
          float acc = 0.0;
          float amp = 0.5;
          float freq = 1.0;
          for (int i = 0; i < 6; i++) {
            acc += amp * noise(uv * freq + vec2(u_time * 0.0005 * freq, float(i) * 1.37));
            freq *= 1.35;
            amp *= 0.65;
          }
          vec3 col = vec3(
            0.2 + 0.6 * sin(acc * 3.14159 + u_time * 0.001),
            0.2 + 0.6 * cos(acc * 2.71828 - u_time * 0.0007),
            0.3 + 0.5 * sin(acc * 1.61803 + 1.0)
          );
          outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(s));
        }
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

      const locPos = gl.getAttribLocation(prog, 'a_pos');
      const locTime = gl.getUniformLocation(prog, 'u_time');
      const locRes = gl.getUniformLocation(prog, 'u_res');

      let running = true;
      let rafId = 0;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(window.innerWidth * dpr));
        const h = Math.max(1, Math.round(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      function draw() {
        resize();
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(locPos);
        gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);
        const t = window.__benchHost ? window.__benchHost.clock.now() : performance.now();
        gl.uniform1f(locTime, t);
        gl.uniform2f(locRes, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.finish();
      }

      function loop() {
        if (!running) return;
        draw();
        rafId = requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      draw();
      rafId = requestAnimationFrame(loop);

      window.__bench = {
        version: 1,
        ready: Promise.resolve(),
        setSeed() {},
        seek() {
          running = false;
          cancelAnimationFrame(rafId);
        },
        resume() {
          if (!running) {
            running = true;
            rafId = requestAnimationFrame(loop);
          }
        },
        async renderFrame() {
          draw();
        },
        state() {
          return { scene: 'webgl_cal' };
        },
        stats() {
          return { drawCalls: 1, triangles: 1, geometries: 1, textures: 0, programs: 1 };
        },
      };
    })();
  </script>
</body>
</html>
