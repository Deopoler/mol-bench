<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Canvas Room Fixture (Non-Deterministic)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script>
    (function () {
      const canvas = document.getElementById('gl');
      const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
      if (!gl) {
        throw new Error('WebGL2 context creation failed');
      }

      function draw() {
        canvas.width = Math.max(1, window.innerWidth);
        canvas.height = Math.max(1, window.innerHeight);
        gl.viewport(0, 0, canvas.width, canvas.height);
        // Deliberately non-deterministic: uses Math.random()!
        gl.clearColor(Math.random(), Math.random(), Math.random(), 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.finish();
      }

      draw();

      window.__bench = {
        version: 1,
        ready: Promise.resolve(),
        setSeed() {},
        seek() {},
        resume() {},
        async renderFrame() {
          draw();
        },
        state() {
          return { nondet: true };
        },
        stats() {
          return { drawCalls: 1, triangles: 0, geometries: 0, textures: 0, programs: 0 };
        },
      };
    })();
  </script>
</body>
</html>
