<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aurora — Flat Black Attack</title>
  <style>
    html, body, canvas { margin: 0; padding: 0; width: 100vw; height: 100vh; display: block; overflow: hidden; background: #050507; }
  </style>
</head>
<body>
  <canvas id="aurora-canvas"></canvas>
  <script type="module">
    const VERT = `#version 300 es
    void main() {
      gl_Position = vec4((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0, 0.0, 1.0);
    }`;
    const FRAG = `#version 300 es
    precision highp float;
    uniform vec2 uResolution;
    uniform vec4 uSeedVec;
    out vec4 outColor;
    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    void main() {
      vec2 uv = gl_FragCoord.xy / uResolution;
      vec3 col = vec3(0.001, 0.001, 0.002);
      if (uv.y > 0.45) {
        vec2 cell = floor(gl_FragCoord.xy / 120.0);
        vec2 loc = fract(gl_FragCoord.xy / 120.0) - 0.5;
        float h = hash12(cell + uSeedVec.xy * 13.0);
        if (h > 0.72 && length(loc) < 0.015) {
          col = vec3(0.95);
        }
      }
      outColor = vec4(col, 1.0);
    }`;
    const canvas = document.getElementById("aurora-canvas");
    const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true });
    const compile = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.useProgram(prog);
    const uRes = gl.getUniformLocation(prog, "uResolution");
    const uSeed = gl.getUniformLocation(prog, "uSeedVec");
    let seedVec = [0.1, 0.2, 0.3, 0.4];
    let ptr = [0.5, 0.5];
    function draw() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
      canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform4f(uSeed, seedVec[0], seedVec[1], seedVec[2], seedVec[3]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    draw();
    window.__bench = {
      version: 1,
      ready: Promise.resolve(),
      setSeed(s) { const r = window.__benchHost?.rng; seedVec = r ? [r.next(), r.next(), r.next(), r.next()] : [s * 0.1, 0.2, 0.3, 0.4]; },
      seek() {},
      resume() {},
      async renderFrame() { draw(); await new Promise((r) => requestAnimationFrame(r)); },
      state() { return { palette: (window.__benchHost?.params?.palette || []).map((c) => [...c]), reducedMotion: false, pointer: [...ptr] }; },
      stats() { return { drawCalls: 1, triangles: 1, geometries: 1, textures: 0, programs: 1, listeners: 0 }; }
    };
  </script>
</body>
</html>
